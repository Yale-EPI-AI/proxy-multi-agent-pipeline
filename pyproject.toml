[project]
name = "epi-proxy"
version = "0.1.0"
description = "Multi-agent system for discovering data proxies for the Yale EPI"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pandas>=2.0",
    "scipy>=1.11",
    "pingouin>=0.5.4",
    "pydantic>=2.5",
    "thefuzz[speedup]>=0.20",
    "requests>=2.28",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "openai>=2.41.0",
    "google-genai>=2.8.0",
    "duckdb>=1.5.3",
    "gradio>=4.0",
    "networkx>=3.0",
    "clingo>=5.6",
]

[project.scripts]
epi-proxy = "epi_proxy.orchestrator:main"
epi-web = "web.app:main"
epi-kg = "scripts.compile_knowledge_graph:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
