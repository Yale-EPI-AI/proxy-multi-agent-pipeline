<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPI Proxy Discovery — Knowledge Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.4/cytoscape.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'YaleNew'; src: url('https://yaleux.github.io/yaleui/assets/fonts/YaleNew-Roman.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'YaleNew'; src: url('https://yaleux.github.io/yaleui/assets/fonts/YaleNew-Bold.woff2') format('woff2'); font-weight: 700; }

  :root {
    --yale-blue: #00356B;
    --yale-blue-light: #2b5f9e;
    --yale-blue-faint: rgba(0, 53, 107, 0.06);
    --epi-green: #2e7d32;
    --green-light: #4caf50;
    --accent-amber: #bf6900;
    --accent-red: #c62828;
    --bg-primary: #ffffff;
    --bg-secondary: #f7f7f5;
    --border: #d4d2cb;
    --border-light: #e8e6e1;
    --text-primary: #2c2c2c;
    --text-secondary: #5a5a5a;
    --text-muted: #8a8a8a;
    --font-body: 'Source Sans 3', 'Segoe UI', sans-serif;
    --font-display: 'YaleNew', Georgia, serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--bg-secondary); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

  /* ── Left sidebar ─────────────────────────────────────── */
  #sidebar {
    width: 280px; background: var(--bg-primary); border-right: 1px solid var(--border);
    padding: 20px; overflow-y: auto; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 20px;
  }

  .sidebar-header {
    border-bottom: 2px solid var(--yale-blue); padding-bottom: 14px;
  }
  .sidebar-header h1 {
    font-family: var(--font-display); font-size: 17px; color: var(--yale-blue);
    font-weight: 700; line-height: 1.3;
  }
  .sidebar-header .subtitle {
    font-size: 12px; color: var(--text-muted); margin-top: 2px;
  }

  .section-label {
    font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px; font-weight: 500;
  }

  .search-box {
    width: 100%; padding: 9px 12px; background: var(--bg-secondary);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-primary); font-family: var(--font-mono); font-size: 13px; outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--yale-blue); box-shadow: 0 0 0 3px var(--yale-blue-faint); }
  .search-box::placeholder { color: var(--text-muted); font-family: var(--font-body); }

  .toggle-group { display: flex; flex-direction: column; gap: 2px; }
  .toggle-item {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px;
    cursor: pointer; font-size: 13px; color: var(--text-secondary);
    border-radius: 4px; transition: background 0.15s;
  }
  .toggle-item:hover { background: var(--yale-blue-faint); }
  .toggle-item input { accent-color: var(--yale-blue); width: 14px; height: 14px; }
  .toggle-item .swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .toggle-item .count { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-left: auto; }

  .legend-section { display: flex; flex-direction: column; gap: 10px; }
  .legend-group-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 2px; }
  .legend-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-line { width: 16px; height: 2px; flex-shrink: 0; border-radius: 1px; }
  .legend-line.dashed { background: repeating-linear-gradient(90deg, var(--accent-amber) 0, var(--accent-amber) 4px, transparent 4px, transparent 7px); }

  .stats-bar {
    font-size: 12px; color: var(--text-muted); line-height: 1.6;
    padding-top: 12px; border-top: 1px solid var(--border-light);
    margin-top: auto;
  }
  .stats-bar strong { color: var(--text-secondary); }

  /* ── Graph area ───────────────────────────────────────── */
  #cy-container { flex: 1; position: relative; background: var(--bg-secondary); }
  #cy { width: 100%; height: 100%; }

  /* ── Popover detail panel ───────────────────────────────── */
  #popover {
    display: none; position: absolute; z-index: 1000;
    background: var(--bg-primary); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px 18px; width: 340px; max-height: 420px;
    overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
    pointer-events: auto;
  }
  #popover.visible { display: block; }

  #popover-title {
    font-family: var(--font-display); font-size: 15px; color: var(--yale-blue);
    font-weight: 700; margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 2px solid var(--yale-blue); line-height: 1.3;
  }
  #popover .field { margin-bottom: 10px; }
  #popover .field-label {
    font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 2px;
  }
  #popover .field-value {
    font-size: 13px; color: var(--text-primary); line-height: 1.5; word-wrap: break-word;
  }
  #popover .field-value a { color: var(--yale-blue-light); text-decoration: none; }
  #popover .field-value a:hover { text-decoration: underline; }

  .verdict-badge {
    display: inline-block; padding: 2px 10px; border-radius: 4px;
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  }
  .verdict-confirmed { background: #e8f5e9; color: var(--epi-green); }
  .verdict-partially_confirmed { background: #fff8e1; color: var(--accent-amber); }
  .verdict-inconclusive { background: #f5f5f5; color: var(--text-muted); }
  .verdict-rejected { background: #fbe9e7; color: var(--accent-red); }

  .stat-chip {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-family: var(--font-mono); font-size: 12px;
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border-light);
  }

  #popover-close {
    position: absolute; top: 10px; right: 12px; background: none; border: none;
    font-size: 18px; color: var(--text-muted); cursor: pointer; line-height: 1;
    padding: 2px 6px; border-radius: 4px;
  }
  #popover-close:hover { background: var(--bg-secondary); color: var(--text-primary); }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <h1>EPI Proxy Discovery<br>Knowledge Graph</h1>
    <div class="subtitle">Yale Center for Environmental Law & Policy</div>
  </div>

  <div>
    <div class="section-label">Search Indicator</div>
    <input type="text" id="search" class="search-box" placeholder="Type TLA (e.g. UWD, WRR)..." list="tla-list">
    <datalist id="tla-list"></datalist>
  </div>

  <div>
    <div class="section-label">Graph Layers</div>
    <div class="toggle-group" id="layer-toggles"></div>
  </div>

  <div>
    <div class="section-label">Relationships</div>
    <div class="toggle-group" id="edge-toggles"></div>
  </div>

  <div>
    <div class="section-label">Verification Status</div>
    <div class="toggle-group" id="verdict-toggles"></div>
  </div>

  <div class="legend-section">
    <div class="section-label">Legend</div>
    <div>
      <div class="legend-group-label">Node types (by size)</div>
      <div class="legend-row" id="legend-nodes"></div>
    </div>
    <div>
      <div class="legend-group-label">Verification verdict</div>
      <div class="legend-row" id="legend-verdicts"></div>
    </div>
    <div>
      <div class="legend-group-label">Relationships</div>
      <div class="legend-row" id="legend-edges"></div>
    </div>
  </div>

  <div class="stats-bar" id="stats"></div>
</div>

<div id="cy-container">
  <div id="cy"></div>
  <div id="popover">
    <button id="popover-close">&times;</button>
    <div id="popover-title"></div>
    <div id="popover-body"></div>
  </div>
</div>

egory": "Biodiversity", "policy_objective": "Ecosystem", "units": "%", "raw_polarity": "positive", "source_org": "MOL", "domain_knowledge": "SPI (Species Protection Index) measures species-level ecological representativeness of a country's protected area network. Uses habitat suitability modeling for 30,000+ species at high resolution. Units: %. Data from Map of Life (personal communication), 1980-2024. No transformation. Polarity: positive. Targets: best=100, worst=0.\n\nNo imputation. Data from personal communication (not publicly available). Relies on habitat suitability modeling.\n\nSibling indicators: SHI, PAR (species/representativ..."}}, {"group": "nodes", "data": {"id": "indicator:PAE", "label": "Protected Area Effectiveness", "node_type": "indicator", "ring": 2, "tla": "PAE", "issue_category": "Biodiversity", "policy_objective": "Ecosystem", "units": "proportion", "raw_polarity": "positive", "source_org": "Dynamic World", "domain_knowledge": "PAE (Protected Area Effectiveness) measures the percentage of protected areas where cropland/built environment growth is below 0.25% between 2017 and 2022. Units: %. Data from WDPA + DynamicWorld v1 (Sentinel-2 AI-driven 10m LULC), single year 2022 (comparing 2017 vs 2022). No transformation. Polarity: positive. Targets: best=100, worst=30.3 (5th pctl).\n\nNo imputation. Pilot indicator. Only covers protected areas >100 km2. Single temporal comparison (2017 vs 2022). Relies on AI-driven satellite ..."}}, {"group": "nodes", "data": {"id": "indicator:PHL", "label": "Protected Human Area", "node_type": "indicator", "ring": 2, "tla": "PHL", "issue_category": "Biodiversity", "policy_objective": "Ecosystem", "units": "proportion", "raw_polarity": "positive", "source_org": "Dynamic World", "domain_knowledge": "PHL (Protected Human Land) measures the percentage of protected area NOT covered by cropland and buildings. Units: %. Data from WDPA + DynamicWorld v1 (Sentinel-2), single year 2022. No transformation. Polarity: positive (higher = better). Targets: best=100, worst=82.4 (5th pctl).\n\nNo imputation. Only covers PAs >100 km2. Single snapshot (2022). Relies on DynamicWorld AI classification with 9 LULC classes.\n\nSibling indicators: PAE (related PA integrity indicator). Weight: 0.5% of EPI."}}, {"group": "nodes", "data": {"id": "indicator:TBN", "label": "Terrestrial Biome Protection _ National weights", "node_type": "indicator", "ring": 2, "tla": "TBN", "issue_category": "Biodiversity", "policy_objective": "Ecosystem", "units": "%", "raw_polarity": "positive", "source_org": "WDPA", "domain_knowledge": "TBN (Terrestrial Biome Protection) measures the percentage of each biome type in a country covered by protected areas, weighted by biome prevalence. Evaluates progress toward the Kunming-Montreal \"30x30\" target. Units: %. Data from WDPA + WWF biome areas, 1990-2024. No transformation. Polarity: positive. Targets: best=30, worst=0.\n\nNo imputation. Credit is capped at 30% per biome (aligned with 30x30 target). Calculation: for each biome, compute % protected, cap at 30%, weight by biome's share of..."}}, {"group": "nodes", "data": {"id": "indicator:TKP", "label": "Terrestrial KBA Protection", "node_type": "indicator", "ring": 2, "tla": "TKP", "issue_category": "Biodiversity", "policy_objective": "Ecosystem", "units": "%", "raw_polarity": "positive", "source_org": "KBA/WDPA", "domain_knowledge": "TKP (Terrestrial KBA Protection) measures the percentage of terrestrial Key Biodiversity Areas covered by protected areas. Units: %. Data from WDPA + WDKBA, 2010-2024. No transformation. Polarity: positive. Targets: best=100, worst=0.\n\nNo imputation. Calculation: rasterize PA and KBA polygons, compute intersection ratio.\n\nSibling indicators: MKP (marine equivalent), TBN, PAR. Weight: 2.5% of EPI."}}, {"group": "nodes", "data": {"id": "indicator:RLI", "label": "Red List Index", "node_type": "indicator", "ring": 2, "tla": "RLI", "issue_category": "Biodiversity", "policy_objective": "Ecosystem", "units": "proportion", "raw_polarity": "positive", "source_org": "IUCN", "domain_knowledge": "RLI (Red List Index) measures overall extinction risk for species in a country, weighting species by the fraction of their range within the country. Units: proportion (0-1). Data from IUCN, 2000-2024. No transformation. Polarity: positive (higher = better, 1 = no species threatened). Targets: best=1.0, worst=0.69 (5th pctl).\n\nNo imputation. Known confounders: assessment effort bias (countries with more assessed species may appear worse); taxonomic coverage differences across groups.\n\nSibling ind..."}}, {"group": "nodes", "data": {"id": "indicator:PFL", "label": "Primary forest loss", "node_type": "indicator", "ring": 2, "tla": "PFL", "issue_category": "EcoSvcs", "policy_objective": "Ecosystem", "units": "proportion", "raw_polarity": "negative", "source_org": "GFW", "domain_knowledge": "PFL (Primary Forest Loss) measures the 5-year moving average of the proportion of primary (humid tropical) forest lost relative to extent in 2001. Units: proportion. Data from Global Forest Watch, 2006-2022. Transformation: ln(x + 0.001). Polarity: negative (lower = better). Targets: best=0, worst=0.0484 (99th pctl).\n\nNo imputation. Forest = areas with >30% canopy cover. Calculation: PFL = PF5 / (5 * PFA), where PF5 = 5-year cumulative loss, PFA = primary forest area in 2001. Loss detection accu..."}}, {"group": "nodes", "data": {"id": "indicator:IFL", "label": "Intact forest landscape loss", "node_type": "indicator", "ring": 2, "tla": "IFL", "issue_category": "EcoSvcs", "policy_objective": "Ecosystem", "units": "proportion", "raw_polarity": "negative", "source_org": "GFW", "domain_knowledge": "IFL (Intact Forest Landscape Loss) measures the 5-year moving average of the proportion of intact forest landscape lost relative to extent in 2000. Intact forest landscapes are large undisturbed forest expanses with disproportionate biodiversity and carbon value. Units: proportion. Data from Global Forest Watch, 2005-2022. Transformation: ln(x + 0.0001). Polarity: negative. Targets: best=0, worst=0.0191 (99th pctl).\n\nNo imputation. Subset of primary forest \u2014 only countries with intact forest lan..."}}, {"group": "nodes", "data": {"id": "indicator:FCL", "label": "Tree cover loss, %", "node_type": "indicator", "ring": 2, "tla": "FCL", "issue_category": "EcoSvcs", "policy_objective": "Ecosystem", "units": "proportion", "raw_polarity": "negative", "source_org": "GFW", "domain_knowledge": "FCL (Tree Cover Loss weighted by Permanency) measures forest loss weighted by the likely permanency of deforestation drivers. 5-year moving average as proportion of 2000 extent. Units: proportion. Data from Global Forest Watch, 2005-2022. Transformation: ln(x + 0.001). Polarity: negative. Targets: best=0, worst=0.0169 (99th pctl).\n\nNo imputation. Permanency weights by driver: Commodity=1.0, Urbanization=1.0, Shifting agriculture=0.75, Forestry=0.50, Wildfire=0.25, Unknown=1.0. FCL = TCL * w_bar ..."}}, {"group": "nodes", "data": {"id": "indicator:TCG", "label": "Net tree cover change", "node_type": "indicator", "ring": 2, "tla": "TCG", "issue_category": "EcoSvcs", "policy_objective": "Ecosystem", "units": "%", "raw_polarity": "positive", "source_org": "GFW", "domain_knowledge": "TCG (Net Tree Cover Change) measures net change in forest cover from 2000 to 2020. Unlike other forest indicators, uses tree height data (not canopy cover). Units: %. Data from Global Forest Watch, SINGLE YEAR 2020 only. No transformation. Polarity: positive (higher = better). Targets: best=10, worst=-10.\n\nNo imputation. SINGLE SNAPSHOT \u2014 no temporal trend possible. Based on tree height rather than canopy data, so not directly comparable to PFL/IFL/FCL.\n\nSibling indicators: PFL, IFL, FCL, FLI. W..."}}, {"group": "nodes", "data": {"id": "indicator:FLI", "label": "Forest Landscape Integrity", "node_type": "indicator", "ring": 2, "tla": "FLI", "issue_category": "EcoSvcs", "policy_objective": "Ecosystem", "units": "%", "raw_polarity": "positive", "source_org": "FLII", "domain_knowledge": "FLI (Forest Landscape Integrity) measures the mean Forest Landscape Integrity Index across a country's territory, based on observed/inferred human disturbances and connectivity loss. Units: % (0-100). Data from Grantham et al. 2020 (Nature Communications), SINGLE YEAR 2020 only. No transformation. Polarity: positive. Targets: best=100, worst=0.\n\nNo imputation. SINGLE SNAPSHOT \u2014 no temporal trend possible. The underlying study found only 40% of remaining forests have high ecosystem integrity.\n\nSi..."}}, {"group": "nodes", "data": {"id": "indicator:FSS", "label": "Fish Stock Status", "node_type": "indicator", "ring": 2, "tla": "FSS", "issue_category": "Fisheries", "policy_objective": "Ecosystem", "units": "percentage", "raw_polarity": "negative", "source_org": "SAU", "domain_knowledge": "FSS (Fish Stock Status) measures the percentage of total catch from collapsed stocks within a country's EEZs. Units: %. Data from Sea Around Us, 1950-2019. Transformation: ln(x + 0.1). Polarity: negative (lower = better). Targets: best=0, worst=17.39 (99th pctl).\n\nNo imputation. Coastal nations only (materiality=SEA). Stock classification: collapsed/over-exploited/exploited/developing/rebuilding. May lag real conditions.\n\nSibling indicators: FCD, BTZ, BTO, RMS (all Fisheries). Weight: 0.3% of EP..."}}, {"group": "nodes", "data": {"id": "indicator:FCD", "label": "Fish Catch Discarded", "node_type": "indicator", "ring": 2, "tla": "FCD", "issue_category": "Fisheries", "policy_objective": "Ecosystem", "units": "proportion", "raw_polarity": "negative", "source_org": "SAU", "domain_knowledge": "FCD (Fish Catch Discarded) measures the proportion of total catch discarded at sea. Proxy for bycatch rates and wasteful fishing. Units: proportion. Data from Sea Around Us, 1950-2019. Transformation: ln(x + 0.01). Polarity: negative. Targets: best=0, worst=0.674 (99th pctl).\n\nNo imputation. Coastal nations only. Discard reporting is notoriously unreliable \u2014 likely underestimates true discards.\n\nSibling indicators: FSS, BTZ, BTO, RMS. Weight: 0.4% of EPI."}}, {"group": "nodes", "data": {"id": "indicator:BTZ", "label": "Bottom Trawling in Country's EEZ", "node_type": "indicator", "ring": 2, "tla": "BTZ", "issue_category": "Fisheries", "policy_objective": "Ecosystem", "units": "proportion", "raw_polarity": "negative", "source_org": "SAU", "domain_knowledge": "BTZ (Bottom Trawling in EEZ) measures the fraction of catch in a country's EEZ captured by bottom trawling or dredging \u2014 indiscriminate practices that damage marine ecosystems. Units: proportion. Data from Sea Around Us, 1950-2019. Transformation: ln(x + 0.1). Polarity: negative. Targets: best=0, worst=0.822 (99th pctl).\n\nNo imputation. Coastal nations only. Gear-type classification accuracy varies by region.\n\nSibling indicators: BTO (global ocean version), FSS, FCD, RMS. Weight: 0.5% of EPI."}}, {"group": "nodes", "data": {"id": "indicator:BTO", "label": "Bottom Trawling in Global Ocean", "node_type": "indicator", "ring": 2, "tla": "BTO", "issue_category": "Fisheries", "policy_objective": "Ecosystem", "units": "proportion", "raw_polarity": "negative", "source_org": "SAU", "domain_knowledge": "BTO (Bottom Trawling in Global Ocean) measures the fraction of a country's entire fleet catch (globally) captured by bottom trawling or dredging. Units: proportion. Data from Sea Around Us, 1950-2019. Transformation: ln(x + 0.1). Polarity: negative. Targets: best=0, worst=0.921 (99th pctl).\n\nNo imputation. Coastal nations only. Same gear-type classification concerns as BTZ.\n\nSibling indicators: BTZ (EEZ version), FSS, FCD, RMS. Weight: 0.7% of EPI."}}, {"group": "nodes", "data": {"id": "indicator:RMS", "label": "Regional Marine Trophic Index", "node_type": "indicator", "ring": 2, "tla": "RMS", "issue_category": "Fisheries", "policy_objective": "Ecosystem", "units": "proportion", "raw_polarity": "positive", "source_org": "SAU", "domain_knowledge": "RMS (Regional Marine Trophic Index) measures \"fishing down the food web\" \u2014 the slope of the Marine Trophic Index over a decade, excluding species below trophic level 3.2. Positive slope = trophic level recovering. Units: unitless. Data from Sea Around Us, 1989-2019. No transformation. Polarity: positive. Targets: best=0.015, worst=-0.015.\n\nNo imputation. Coastal nations only. Geographic expansion of fishing can mask trophic decline. MTI is catch-weighted, so shifts in target species matter. Requ..."}}, {"group": "nodes", "data": {"id": "indicator:WWG", "label": "Wastewater produced per capita", "node_type": "indicator", "ring": 2, "tla": "WWG", "issue_category": "WaterResources", "policy_objective": "Ecosystem", "units": "m3 per year per person", "raw_polarity": "negative", "source_org": "Jones et al 2020, UNSD", "domain_knowledge": "WWG (Wastewater Generated per Capita) measures wastewater produced per person per year. Units: m^3/person/year. Data from Jones et al. 2021 (published in PANGAEA) and UN Statistics Division (2015-2021). Transformation: ln(x). Polarity: negative (more = worse). Performance targets: 5th/95th percentile.\n\nPart of the wastewater indicator cluster (WWG/WWC/WWT/WWR) under Water Resources (Ecosystem Vitality). These four indicators are hierarchically related: WWG is total generated, WWC is proportion c..."}}, {"group": "nodes", "data": {"id": "indicator:WWC", "label": "Wastewater collected", "node_type": "indicator", "ring": 2, "tla": "WWC", "issue_category": "WaterResources", "policy_objective": "Ecosystem", "units": "proportion", "raw_polarity": "positive", "source_org": "Jones et al 2020, UNSD, Eurostat, OECD", "domain_knowledge": "WWC (Wastewater Collected) measures the proportion of wastewater collected for treatment. Sometimes measured as the percentage of population connected to wastewater treatment facilities. Units: proportion (0-1). Data from Jones et al. 2021, Eurostat, UNSD, OECD (2015-2021). No transformation applied. Polarity: positive (higher collection = better).\n\nWWC is strongly correlated with urbanization (sewer systems are urban infrastructure) and GDP per capita. No cross-sectional imputation model is doc..."}}, {"group": "nodes", "data": {"id": "indicator:WWT", "label": "Wastewater treatment ", "node_type": "indicator", "ring": 2, "tla": "WWT", "issue_category": "WaterResources", "policy_objective": "Ecosystem", "units": "proportion", "raw_polarity": "positive", "source_org": "Jones et al 2020, UNSD, OECD", "domain_knowledge": "WWT (Wastewater Treated) measures the proportion of municipal wastewater that undergoes at least primary treatment. Units: proportion (0-1). Data from Jones et al. 2021, UNSD, OECD (2015-2021). No transformation applied. Polarity: positive (higher treatment = better).\n\nWWT is the most policy-relevant wastewater indicator because treatment is where pollution reduction occurs. No cross-sectional imputation model is documented in the Technical Appendix.\n\nKey issue: treatment level definitions vary ..."}}, {"group": "nodes", "data": {"id": "indicator:WWR", "label": "Wastewater reuse", "node_type": "indicator", "ring": 2, "tla": "WWR", "issue_category": "WaterResources", "policy_objective": "Ecosystem", "units": "proportion", "raw_polarity": "positive", "source_org": "Jones et al 2020", "domain_knowledge": "WWR (Wastewater Reused) measures the proportion of wastewater reused after treatment, either for irrigation in agriculture or, when clean enough, in industry or as drinking water. Units: proportion (0-1). Data from Jones et al. 2021 (2015 only). No transformation applied. Polarity: positive (higher reuse = better).\n\nWWR has the WORST temporal coverage of all wastewater indicators \u2014 data exists for a single year (2015) for most countries. This makes trend analysis impossible with official data al..."}}, {"group": "nodes", "data": {"id": "indicator:COE", "label": "Carbon Monoxide Exposure", "node_type": "indicator", "ring": 2, "tla": "COE", "issue_category": "AirQuality", "policy_objective": "Health", "units": "ppm", "raw_polarity": "negative", "source_org": "Copernicus", "domain_knowledge": "COE (CO Exposure) measures population-weighted annual average carbon monoxide concentration at ground level. Units: ppm. Data from Copernicus/CAMS, 2003-2022. Transformation: ln(x). Polarity: negative (lower = better). Targets: best=0.0505 (1st pctl), worst=0.753 (99th pctl).\n\nCopernicus reanalysis \u2014 no imputation needed. Associated with incomplete combustion (vehicles, biomass burning, industry). Correlates with HFD (solid fuel use is a major CO source). Shorter time series starting 2003.\n\nSibl..."}}, {"group": "nodes", "data": {"id": "indicator:HFD", "label": "Household air pollution from solid fuels DALYs", "node_type": "indicator", "ring": 2, "tla": "HFD", "issue_category": "AirQuality", "policy_objective": "Health", "units": "Age-standardized DALYs/100k people", "raw_polarity": "negative", "source_org": "IHME", "domain_knowledge": "HFD (Household Air Pollution from Solid Fuels) measures age-standardized DALYs per 100k from household air pollution due to solid fuel use (wood, charcoal, dung, coal for cooking/ heating). Units: DALYs/100k. Data from IHME Global Burden of Disease, 1990-2021. Transformation: ln(x). Polarity: negative (lower = better). Targets: best=0.05, worst=10000.\n\nIHME provides modeled estimates for all countries \u2014 no imputation needed. Strongly correlated with GDP/income (wealthier countries use cleaner fu..."}}, {"group": "nodes", "data": {"id": "indicator:HFX", "label": "Household air pollution from solid fuels", "node_type": "indicator", "ring": 2, "tla": "HFX", "issue_category": "AirQuality", "policy_objective": "Health", "units": "proportion", "raw_polarity": "negative", "source_org": "IHME"}}, {"group": "nodes", "data": {"id": "indicator:NOD", "label": "NO2 Exposure DALYs", "node_type": "indicator", "ring": 2, "tla": "NOD", "issue_category": "AirQuality", "policy_objective": "Health", "units": "Age-standardized DALYs/100k people", "raw_polarity": "negative", "source_org": "IHME", "domain_knowledge": "NOD (NO2 Exposure DALYs) measures age-standardized DALYs per 100k from NO2 pollution. Units: DALYs/100k. Data from IHME, 1990-2021. Transformation: ln(x). Polarity: negative (lower = better). Targets: best=0.025 (5th pctl), worst=17.08 (99th pctl).\n\nIHME modeled estimates \u2014 no imputation needed. Strongly tied to traffic density and fossil fuel combustion; highly correlated with urbanization and industrial activity. NO2 is spatially variable (roadside vs background), so national averages mask exp..."}}, {"group": "nodes", "data": {"id": "indicator:NOE", "label": "Nitrogen Oxides Exposure", "node_type": "indicator", "ring": 2, "tla": "NOE", "issue_category": "AirQuality", "policy_objective": "Health", "units": "ppm", "raw_polarity": "negative", "source_org": "Copernicus"}}, {"group": "nodes", "data": {"id": "indicator:OZD", "label": "Ozone Exposure DALYs", "node_type": "indicator", "ring": 2, "tla": "OZD", "issue_category": "AirQuality", "policy_objective": "Health", "units": "Age-standardized DALYs/100k people", "raw_polarity": "negative", "source_org": "IHME", "domain_knowledge": "OZD (Ozone Exposure DALYs) measures age-standardized DALYs per 100k from ground-level ozone pollution. Units: DALYs/100k. Data from IHME, 1990-2021. Transformation: ln(x). Polarity: negative (lower = better). Targets: best=1, worst=250.\n\nIHME modeled estimates \u2014 no imputation needed. Ozone formation depends on temperature, UV radiation, and NOx/VOC precursors from industry and transport. Can be higher in rural downwind areas than urban centers. Ozone health effects are less well-characterized th..."}}, {"group": "nodes", "data": {"id": "indicator:OZE", "label": "Ozone Exposure", "node_type": "indicator", "ring": 2, "tla": "OZE", "issue_category": "AirQuality", "policy_objective": "Health", "units": "ppm", "raw_polarity": "negative", "source_org": "IHME"}}, {"group": "nodes", "data": {"id": "indicator:HPE", "label": "Ambient anthropogenic particulate matter pollution exposure", "node_type": "indicator", "ring": 2, "tla": "HPE", "issue_category": "AirQuality", "policy_objective": "Health", "units": "ug/m3", "raw_polarity": "negative", "source_org": "WUSTL", "domain_knowledge": "HPE (Anthropogenic PM2.5 Exposure) measures population-weighted average fine particulate matter concentration from human sources. Calculated as HPE = PME x FHP, where PME is satellite-derived total PM2.5 and FHP is the anthropogenic fraction (excluding dust, sea spray, volcanoes). Units: ug/m3. Data from Washington University in St. Louis (PME) and GBD Major Air Pollution Sources (FHP), 1998-2022. Transformation: ln(x). Polarity: negative (lower = better). Targets: best=2.5, worst=28.58 (95th pc..."}}, {"group": "nodes", "data": {"id": "indicator:SOE", "label": "Sulfur Dioxide Exposure", "node_type": "indicator", "ring": 2, "tla": "SOE", "issue_category": "AirQuality", "policy_objective": "Health", "units": "ppm", "raw_polarity": "negative", "source_org": "Copernicus", "domain_knowledge": "SOE (SO2 Exposure) measures population-weighted annual average SO2 concentration at ground level. Units: ppm. Data from Copernicus Atmosphere Monitoring Service (CAMS reanalysis), 2003-2022. Transformation: ln(x). Polarity: negative (lower = better). Targets: best=0.000282 (5th pctl), worst=0.0609 (95th pctl).\n\nCopernicus reanalysis provides global coverage \u2014 no imputation needed. Strongly associated with coal-burning power plants, heavy industry, and volcanic activity. Shorter time series than ..."}}, {"group": "nodes", "data": {"id": "indicator:VOE", "label": "Volatile Organic Compound Exposure", "node_type": "indicator", "ring": 2, "tla": "VOE", "issue_category": "AirQuality", "policy_objective": "Health", "units": "ppm", "raw_polarity": "negative", "source_org": "Copernicus", "domain_knowledge": "VOE (VOC Exposure) measures population-weighted annual average volatile organic compound concentration at ground level. Units: ppm. Data from Copernicus/CAMS, 2003-2022. Transformation: ln(x). Polarity: negative (lower = better). Targets: best=0.000732 (5th pctl), worst=0.0972 (95th pctl).\n\nCopernicus reanalysis \u2014 no imputation needed. VOCs come from both anthropogenic sources (solvents, fuels, industry) and biogenic sources (tropical forests emit large amounts of isoprene). Biogenic VOCs may do..."}}, {"group": "nodes", "data": {"id": "indicator:LED", "label": "Lead Exposure DALYs", "node_type": "indicator", "ring": 2, "tla": "LED", "issue_category": "HeavyMetals", "policy_objective": "Health", "units": "Age-standardized DALYs/100k people", "raw_polarity": "negative", "source_org": "IHME", "domain_knowledge": "LED (Lead Exposure) measures age-standardized DALYs per 100k from lead contamination. Units: DALYs/100k. Data from IHME, 1990-2021. Transformation: ln(x). Polarity: negative (lower = better). Targets: best=62.32 (1st pctl), worst=2058.33 (99th pctl).\n\nIHME modeled estimates \u2014 no imputation needed. Known confounders: historical leaded gasoline use, lead paint prevalence, lead smelting/mining, lead water pipes. Strongly correlated with regulatory history and industrial legacy. Lead exposure pathwa..."}}, {"group": "nodes", "data": {"id": "indicator:LEX", "label": "Lead Exposure", "node_type": "indicator", "ring": 2, "tla": "LEX", "issue_category": "HeavyMetals", "policy_objective": "Health", "units": "micrograms (ug) of lead per decilitier (dL) of blood", "raw_polarity": "negative", "source_org": "IHME"}}, {"group": "nodes", "data": {"id": "indicator:WPC", "label": "Waste Per Capita", "node_type": "indicator", "ring": 2, "tla": "WPC", "issue_category": "WasteManagement", "policy_objective": "Health", "units": "tonns/person", "raw_polarity": "negative", "source_org": "Various", "domain_knowledge": "WPC (Waste per Cap -2022). No transformation applied. Polarity: positive (higher controlled proportion = better).\n\nNote: SMW include..."}}, {"group": "nodes", "data": {"id": "indicator:USD", "label": "Unsafe sanitation health burden", "node_type": "indicator", "ring": 2, "tla": "USD", "issue_category": "WaterQuality", "policy_objective": "Health", "units": "Age-standardized DALYs/100k people", "raw_polarity": "negative", "source_org": "IHME", "domain_knowledge": "USD (Unsafe Sanitation) measures age-standardized DALYs per 100k from exposure to inadequate sanitation facilities. Units: DALYs/100k. Data from IHME Global Burden of Disease, 1990-2021. Transformation: ln(x). Polarity: negative (lower = better). Targets: best=0.757 (1st pctl), worst=7064.66 (99th pctl).\n\nIHME modeled estimates for all countries \u2014 no imputation needed. Strongly correlated with GDP, urbanization, and governance quality. Sanitation infrastructure investment lags economic developme..."}}, {"group": "nodes", "data": {"id": "indicator:UWD", "label": "Unsafe drinking water health burden", "node_type": "indicator", "ring": 2, "tla": "UWD", "issue_category": "WaterQuality", "policy_objective": "Health", "units": "Age-standardized DALYs/100k people", "raw_polarity": "negative", "source_org": "IHME", "domain_knowledge": "UWD (Unsafe Drinking Water) measures age-standardized disability-adjusted life-years (DALYs) lost per 100,000 persons due to unsafe drinking water. Units: DALYs/100k. Data from IHME Global Burden of Disease study, 1990-2021, ~195 countries. Polarity: negative (lower = better). Transformation: ln(x).\n\nUWD sits under Sanitation & Drinking Water (Environmental Health). IHME provides near-full global coverage so no cross-sectional imputation model is documented \u2014 only temporal interpolation/extrapol..."}}, {"group": "nodes", "data": {"id": "indicator:USX", "label": "Unsafe sanitation ", "node_type": "indicator", "ring": 2, "tla": "USX", "issue_category": "WaterQuality", "policy_objective": // ── Default visibility ─────────────────────────────────────────
const defaultNodeVis = {
  policy_objective: true, issue_category: true,
  indicator: true, proxy_variable: true, data_source: false,
};
const defaultEdgeVis = {
  contains: true, proxy_for: true, measured_by: false,
  same_issue_category: false, sibling_indicator: false, inferred_candidate: true,
};
const defaultVerdictVis = {
  confirmed: true, partially_confirmed: true, inconclusive: true, rejected: true,
};

let nodeVis = {...defaultNodeVis};
let edgeVis = {...defaultEdgeVis};
let verdictVis = {...defaultVerdictVis};
let searchTLA = '';

// ── Setup controls ─────────────────────────────────────────────
function setupControls() {
  // Layer (node type) toggles
  const lt = document.getElementById('layer-toggles');
  for (const [type, label] of Object.entries(nodeLabels)) {
    const count = allElements.filter(e => e.group === 'nodes' && e.data.node_type === type).length;
    lt.innerHTML += `<label class="toggle-item">
      <input type="checkbox" data-node-type="${type}" ${defaultNodeVis[type] ? 'checked' : ''}>
      <span class="swatch" style="background:${nodeColors[type]}"></span>
      ${label}
      <span class="count">${count}</span>
    </label>`;
  }
  lt.querySelectorAll('input').forEach(cb => cb.addEventListener('change', e => {
    nodeVis[e.target.dataset.nodeType] = e.target.checked;
    if (e.target.dataset.nodeType === 'data_source') {
      edgeVis.measured_by = e.target.checked;
      const mb = document.querySelector('[data-edge-type="measured_by"]');
      if (mb) mb.checked = e.target.checked;
    }
    applyFilters();
  }));

  // Edge toggles
  const et = document.getElementById('edge-toggles');
  for (const [type, label] of Object.entries(edgeLabels)) {
    const count = allElements.filter(e => e.group === 'edges' && e.data.edge_type === type).length;
    et.innerHTML += `<label class="toggle-item">
      <input type="checkbox" data-edge-type="${type}" ${defaultEdgeVis[type] ? 'checked' : ''}>
      <span class="swatch" style="background:${edgeColors[type]}; border-radius:1px; height:3px; width:12px;"></span>
      ${label}
      <span class="count">${count}</span>
    </label>`;
  }
  et.querySelectorAll('input').forEach(cb => cb.addEventListener('change', e => {
    edgeVis[e.target.dataset.edgeType] = e.target.checked;
    applyFilters();
  }));

  // Verdict toggles
  const vt = document.getElementById('verdict-toggles');
  for (const [verdict, label] of Object.entries(verdictLabels)) {
    const count = allElements.filter(e => e.group === 'nodes' && e.data.verdict === verdict).length;
    vt.innerHTML += `<label class="toggle-item">
      <input type="checkbox" data-verdict="${verdict}" checked>
      <span class="swatch" style="background:${verdictColors[verdict]}"></span>
      ${label}
      <span class="count">${count}</span>
    </label>`;
  }
  vt.querySelectorAll('input').forEach(cb => cb.addEventListener('change', e => {
    verdictVis[e.target.dataset.verdict] = e.target.checked;
    applyFilters();
  }));

  // Legends
  const ln = document.getElementById('legend-nodes');
  const ringLabels = ['policy_objective', 'issue_category', 'indicator', 'proxy_variable', 'data_source'];
  ringLabels.forEach(t => {
    ln.innerHTML += `<span class="legend-item"><span class="legend-dot" style="background:${nodeColors[t]}"></span>${nodeLabels[t].replace('EPI ', '')}</span>`;
  });

  const lv = document.getElementById('legend-verdicts');
  for (const [v, label] of Object.entries(verdictLabels)) {
    lv.innerHTML += `<span class="legend-item"><span class="legend-dot" style="background:${verdictColors[v]}"></span>${label}</span>`;
  }

  const le = document.getElementById('legend-edges');
  le.innerHTML += `<span class="legend-item"><span class="legend-line" style="background:${edgeColors.proxy_for}"></span>Proxy link</span>`;
  le.innerHTML += `<span class="legend-item"><span class="legend-line dashed"></span>Inferred</span>`;
  le.innerHTML += `<span class="legend-item"><span class="legend-line" style="background:${edgeColors.contains}"></span>Hierarchy</span>`;

  // TLA datalist
  const dl = document.getElementById('tla-list');
  tlaList.forEach(tla => { const o = document.createElement('option'); o.value = tla; dl.appendChild(o); });
}

// ── Cytoscape init ─────────────────────────────────────────────
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: [],
  style: [
    // Base node
    { selector: 'node', style: {
      'label': 'data(label)', 'font-family': '"Source Sans 3", sans-serif',
      'font-size': 9, 'color': '#5a5a5a',
      'text-valign': 'bottom', 'text-margin-y': 5,
      'text-max-width': 85, 'text-wrap': 'ellipsis',
      'background-color': '#999', 'width': 18, 'height': 18, 'border-width': 0,
      'transition-property': 'opacity, background-color, border-width, border-color, width, height',
      'transition-duration': '0.25s',
    }},
    // Policy objectives — center
    { selector: 'node[node_type="policy_objective"]', style: {
      'background-color': '#00356B', 'width': 44, 'height': 44,
      'font-family': '"YaleNew", Georgia, serif',
      'font-size': 13, 'font-weight': 'bold', 'color': '#00356B',
      'text-margin-y': 7,
    }},
    // Issue categories — ring 1
    { selector: 'node[node_type="issue_category"]', style: {
      'background-color': '#2b5f9e', 'width': 28, 'height': 28,
      'font-size': 10, 'color': '#2b5f9e', 'font-weight': '600',
    }},
    // Indicators — ring 2
    { selector: 'node[node_type="indicator"]', style: {
      'background-color': '#4a90d9', 'width': 20, 'height': 20,
      'font-size': 9, 'color': '#5a5a5a',
      'font-family': '"JetBrains Mono", monospace',
    }},
    // Proxies — ring 3
    { selector: 'node[node_type="proxy_variable"]', style: {
      'background-color': '#2e7d32', 'width': 12, 'height': 12,
      'font-size': 7, 'color': '#8a8a8a',
    }},
    // Data sources — ring 4
    { selector: 'node[node_type="data_source"]', style: {
      'background-color': '#8a8a8a', 'width': 10, 'height': 10,
      'font-size': 7, 'shape': 'diamond', 'color': '#8a8a8a',
    }},
    // Verdict overrides for proxy nodes
    { selector: 'node[verdict="confirmed"]', style: { 'background-color': '#2e7d32' }},
    { selector: 'node[verdict="partially_confirmed"]', style: { 'background-color': '#bf6900' }},
    { selector: 'node[verdict="inconclusive"]', style: { 'background-color': '#8a8a8a' }},
    { selector: 'node[verdict="rejected"]', style: { 'background-color': '#c62828' }},
    // Base edge
    { selector: 'edge', style: {
      'width': 1, 'line-color': '#d4d2cb', 'curve-style': 'bezier',
      'target-arrow-shape': 'triangle', 'target-arrow-color': '#d4d2cb',
      'arrow-scale': 0.5, 'opacity': 0.4,
      'transition-property': 'opacity, line-color, width',
      'transition-duration': '0.25s',
    }},
    // Edge type styles
    { selector: 'edge[edge_type="contains"]', style: {
      'line-color': '#b0ada6', 'target-arrow-color': '#b0ada6', 'width': 1.5, 'opacity': 0.5,
    }},
    { selector: 'edge[edge_type="proxy_for"]', style: {
      'line-color': '#2e7d32', 'target-arrow-color': '#2e7d32', 'width': 2, 'opacity': 0.6,
    }},
    { selector: 'edge[edge_type="inferred_candidate"]', style: {
      'line-color': '#bf6900', 'target-arrow-color': '#bf6900',
      'width': 1.5, 'line-style': 'dashed', 'opacity': 0.5,
    }},
    { selector: 'edge[edge_type="measured_by"]', style: {
      'line-color': '#8a8a8a', 'target-arrow-color': '#8a8a8a', 'opacity': 0.3,
    }},
    { selector: 'edge[edge_type="same_issue_category"]', style: {
      'line-color': '#e8e6e1', 'target-arrow-shape': 'none', 'opacity': 0.2,
    }},
    { selector: 'edge[edge_type="sibling_indicator"]', style: {
      'line-color': '#6a1b9a', 'target-arrow-shape': 'none', 'opacity': 0.25,
    }},
    // Highlight / dim
    { selector: '.highlighted', style: {
      'border-width': 3, 'border-color': '#00356B', 'z-index': 999,
    }},
    { selector: '.dimmed', style: { 'opacity': 0.08 }},
    { selector: 'edge.dimmed', style: { 'opacity': 0.03 }},
    { selector: '.highlighted-edge', style: { 'opacity': 0.9, 'width': 2.5, 'z-index': 999 }},
  ],
  layout: { name: 'preset' },
  wheelSensitivity: 0.3,
});

// ── Filtering ──────────────────────────────────────────────────
function getFilteredElements() {
  return allElements.filter(el => {
    if (el.group === 'nodes') {
      if (!nodeVis[el.data.node_type]) return false;
      if (el.data.node_type === 'proxy_variable' && el.data.verdict && !verdictVis[el.data.verdict]) return false;
      return true;
    }
    if (el.group === 'edges') {
      return edgeVis[el.data.edge_type] !== false;
    }
    return true;
  });
}

function applyFilters() {
  const filtered = getFilteredElements();
  cy.elements().remove();
  cy.add(filtered);
  // Prune orphan edges
  cy.edges().forEach(e => {
    if (!cy.getElementById(e.data('source')).length || !cy.getElementById(e.data('target')).length) {
      e.remove();
    }
  });
  runLayout();
  applySearch();
  updateStats();
}

function applySearch() {
  cy.elements().removeClass('highlighted dimmed highlighted-edge');
  if (!searchTLA) return;
  const center = cy.getElementById('indicator:' + searchTLA);
  if (!center.length) return;

  const connected = center.neighborhood().add(center);
  const parent = center.incomers('edge[edge_type="contains"]').sources();
  const grandparent = parent.incomers('edge[edge_type="contains"]').sources();
  const highlight = connected.add(parent).add(grandparent);

  cy.elements().addClass('dimmed');
  highlight.removeClass('dimmed');
  center.addClass('highlighted');
  highlight.edges().addClass('highlighted-edge');
}

// ── Layout (concentric only) ───────────────────────────────────
function runLayout() {
  cy.layout({
    name: 'cose',
    idealEdgeLength: 100,
    nodeOverlap: 20,
    nodeRepulsion: 12000,
    edgeElasticity: 80,
    gravity: 0.3,
    numIter: 800,
    animate: true,
    animationDuration: 800,
    animationEasing: 'ease-out',
  }).run();
}

// ── Popover ────────────────────────────────────────────────────
const popover = document.getElementById('popover');
const popoverTitle = document.getElementById('popover-title');
const popoverBody = document.getElementById('popover-body');

function showPopover(data, type, renderedPos) {
  let html = '';

  if (type === 'node') {
    popoverTitle.textContent = data.label || data.id;
    const nt = data.node_type || '';

    if (nt === 'indicator') {
      html += field('TLA', `<span class="stat-chip">${data.tla}</span>`);
      html += field('Issue Category', data.issue_category);
      html += field('Policy Objective', data.policy_objective);
      html += field('Units', data.units);
      html += field('Polarity', data.raw_polarity);
      html += field('Data Source', data.source_org);
      if (data.domain_knowledge) html += field('Domain Knowledge', data.domain_knowledge);
    } else if (nt === 'proxy_variable') {
      html += field('Hypothesis', `<span class="stat-chip">${data.hypothesis_id}</span>`);
      if (data.target_tla) html += field('Target Indicator', `<span class="stat-chip">${data.target_tla}</span>`);
      if (data.verdict) html += field('Verdict', `<span class="verdict-badge verdict-${data.verdict}">${(data.verdict || '').replace(/_/g, ' ')}</span>`);
      html += field('Confidence', data.confidence ? data.confidence.replace(/_/g, ' ') : '');
      html += field('Evidence Type', data.evidence_type ? data.evidence_type.replace(/_/g, ' ') : '');
      if (data.proxy_description) html += field('Description', data.proxy_description);
    } else if (nt === 'data_source') {
      html += field('Organization', data.organization);
      if (data.url) html += field('URL', `<a href="${data.url}" target="_blank">${data.url}</a>`);
      html += field('Accessibility', data.accessibility);
      html += field('Coverage', data.coverage);
    } else if (nt === 'policy_objective') {
      popoverTitle.textContent = data.label;
      html += field('Role', 'Top-level EPI policy objective');
      html += field('Description', data.description);
    } else if (nt === 'issue_category') {
      popoverTitle.textContent = data.label;
      html += field('Role', 'EPI issue category grouping related indicators');
      html += field('Description', data.description);
    }
  } else if (type === 'edge') {
    const et = data.edge_type || '';
    popoverTitle.textContent = edgeLabels[et] || et;

    html += field('From', data.source);
    html += field('To', data.target);

    if (et === 'proxy_for') {
      if (data.verdict) html += field('Verdict', `<span class="verdict-badge verdict-${data.verdict}">${(data.verdict || '').replace(/_/g, ' ')}</span>`);
      html += field('Direction', data.direction);
      html += field('Functional Form', data.functional_form);
      html += field('Expected Strength', data.strength_estimate);
      if (data.pearson_r !== undefined && data.pearson_r !== '') html += field('Pearson r', `<span class="stat-chip">${data.pearson_r}</span>`);
      if (data.pearson_p !== undefined && data.pearson_p !== '') html += field('Pearson p', `<span class="stat-chip">${data.pearson_p}</span>`);
      if (data.partial_r !== undefined && data.partial_r !== '') html += field('Partial r (GDP controlled)', `<span class="stat-chip">${data.partial_r}</span>`);
      if (data.n_observations) html += field('N observations', `<span class="stat-chip">${data.n_observations}</span>`);
      if (data.mechanism) html += field('Mechanism', data.mechanism);
    } else if (et === 'inferred_candidate') {
      html += field('Rule', data.rule_name);
      if (data.confidence) html += field('Confidence', `<span class="stat-chip">${data.confidence}</span>`);
      html += field('Explanation', data.explanation);
    }
  }

  popoverBody.innerHTML = html || 'No details';

  // Position near the node/edge within the cy-container
  const container = document.getElementById('cy-container');
  const rect = container.getBoundingClientRect();
  let left = renderedPos.x + 20;
  let top = renderedPos.y - 20;

  // Keep popover within container bounds
  const pw = 340, ph = 420;
  if (left + pw > rect.width) left = renderedPos.x - pw - 20;
  if (top + ph > rect.height) top = rect.height - ph - 10;
  if (top < 10) top = 10;
  if (left < 10) left = 10;

  popover.style.left = left + 'px';
  popover.style.top = top + 'px';
  popover.classList.add('visible');
}

function hidePopover() {
  popover.classList.remove('visible');
}

function field(label, value) {
  if (value === undefined || value === null || value === '') return '';
  return `<div class="field"><div class="field-label">${label}</div><div class="field-value">${value}</div></div>`;
}

// ── Stats bar ──────────────────────────────────────────────────
function updateStats() {
  const s = document.getElementById('stats');
  const nn = cy.nodes().length;
  const ne = cy.edges().length;
  const tn = allElements.filter(e => e.group === 'nodes').length;
  const te = allElements.filter(e => e.group === 'edges').length;
  s.innerHTML = `<strong>Showing</strong> ${nn} nodes, ${ne} edges<br><strong>Total</strong> ${tn} nodes, ${te} edges`;
}

// ── Events ─────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchTLA = e.target.value.toUpperCase().trim();
  applySearch();
});

// Close popover
document.getElementById('popover-close').addEventListener('click', hidePopover);

// Click on node
cy.on('click', 'node', function(e) {
  const node = e.target;
  showPopover(node.data(), 'node', node.renderedPosition());
});

// Click on edge
cy.on('click', 'edge', function(e) {
  const edge = e.target;
  const mid = edge.renderedMidpoint();
  showPopover(edge.data(), 'edge', mid);
});

// Click on background — close popover
cy.on('click', function(e) {
  if (e.target === cy) hidePopover();
});

// Cursor feedback on hover
cy.on('mouseover', 'node, edge', function() { document.getElementById('cy').style.cursor = 'pointer'; });
cy.on('mouseout', 'node, edge', function() { document.getElementById('cy').style.cursor = 'default'; });

// ── Init ───────────────────────────────────────────────────────
setupControls();
applyFilters();
</script>
</body>
</html>
